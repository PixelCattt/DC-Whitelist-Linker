name: DC-Whitelist-Linker
main: com.pixelcatt.dc_whitelist_linker.DCWhitelistLinker
version: ${project.version}
api-version: 1.21
commands:
  unlinkdc:
    description: Unlink Discord Account.
    usage: /unlinkdc
    permission: dcwhitelistlinker.unlinkdc
    permission-message: You do not have access to this command.
  addwhitelist:
    description: Add a Player to the linked Whitelist
    usage: /addwhitelist <Minecraft_Username> <Discord-Username>
    permission: dcwhitelistlinker.addwhitelist
    permission-message: You do not have access to this command
  remwhitelist:
    description: Remove a Player from the linked Whitelist
    usage: /remwhitelist <Minecraft_Username>
    permission: dcwhitelistlinker.remwhitelist
    permission-message: You do not have access to this command
permissions:
  dcwhitelistlinker.player:
    description: Allows use of all Player Commands
    default: true
    children:
      dcwhitelistlinker.unlinkdc: true
  dcwhitelistlinker.unlinkdc:
    description: Allows use of the UnLinkDC Command
    default: true

  dcwhitelistlinker.admin:
    description: Allows use of Admin Commands
    default: op
    children:
      dcwhitelistlinker.addwhitelist: true
      dcwhitelistlinker.remwhitelist: true
  dcwhitelistlinker.addwhitelist:
    description: Allows use of the AddWhitelist Command
    default: op
  dcwhitelistlinker.remwhitelist:
    description: Allows use of the RemWhitelist Command
    default: op